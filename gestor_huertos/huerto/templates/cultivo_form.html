<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Editar Cultivo{% else %}Agregar Cultivo{% endif %}</title>
</head>
<body>
    <h1>{% if object %}Editar Cultivo{% else %}Agregar Cultivo{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <a href="{% url 'cultivos:lista' %}">Volver a la lista</a>
</body>
</html>
